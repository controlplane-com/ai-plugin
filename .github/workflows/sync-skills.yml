name: Sync skills to Langfuse

# Publishes every skill under plugins/cpln/skills to the Langfuse project the Control Plane
# onboarding agent reads its guides from: develop under the label "test", main under
# "production", the same branches the test and production MCP servers read. A skill whose
# files did not change gets no new version, and a label already on a version stays there.
# Skills are edited here only, never in Langfuse: the next push would replace the edit.

on:
  push:
    branches: [main, develop]
    paths:
      - "plugins/cpln/skills/**"
      - ".github/workflows/sync-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-skills-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Publish skills
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish skills under the branch's label
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: https://us.cloud.langfuse.com
          LABEL: ${{ github.ref_name == 'main' && 'production' || 'test' }}
        run: |
          npx --yes langfuse-cli@1.3.1 --host "$LANGFUSE_HOST" skills push plugins/cpln/skills \
            --recursive --no-lockfile --label "$LABEL" \
            --commit-message "ai-plugin ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
