name: Checks

# Content validation on every push/PR (the release workflow only fires on version tags).
# Checks that every MCP tool mentioned in skills/rules/agents/commands exists in the MCP
# server's registry and respects toolset-profile visibility (see scripts/check-tool-mentions.mjs;
# regenerate scripts/tools-manifest.json from the MCP server repo when tools change).

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  validate:
    name: Tool mentions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tool mentions exist and respect toolset profiles
        run: node scripts/check-tool-mentions.mjs

      - name: Set up Python for public package validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/submission-requirements.txt

      - name: Install submission validation dependencies
        run: python -m pip install -r scripts/submission-requirements.txt

      - name: Public export and archive regression checks
        run: python -m unittest discover -s scripts -p 'test_package_openai.py' -v
